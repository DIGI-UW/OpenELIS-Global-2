services:
  certs:
    container_name: oe-certs
    image: certgen
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.certs
    restart: "no"
    # Gives the install its own TLS key on first start and keeps the stores built from it.
    environment:
        - KEYSTORE_PW=${SSL_KEYSTORE_PASSWORD:-kspass}
        - TRUSTSTORE_PW=${SSL_TRUSTSTORE_PASSWORD:-tspass}
    networks:
        - default  
    volumes:
        - type: volume
          source: key_trust-store-volume
          target: /etc/openelis-global
          volume:
            nocopy: true
        - type: volume
          source: keys-vol
          target: /etc/ssl/private/
          volume:
            nocopy: true
        - type: volume
          source: certs-vol
          target: /etc/ssl/certs/
          volume:
            nocopy: true
  db.openelis.org:
      build:
        context: .
        dockerfile: ./db/Dockerfile
      container_name: openelisglobal-database 
      image: openelisglobal-databse.build
      ports:
          - "15432:5432"
      restart: always
      env_file:
          - ./volume/database/database.env
      environment:
          - DB_PASSWORD=${OE_DB_PASSWORD:-clinlims}
          - DB_SUPERUSER_PASSWORD=${ADMIN_PASSWORD:-superuser}
      volumes:
              # preserves the database between containers
          - db-data:/var/lib/postgresql/data                
      networks:
          - default
      healthcheck:
            # The initialization server accepts sockets before network connections.
            test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-q", "-d", "clinlims", "-U", "clinlims" ]
            timeout: 45s
            interval: 10s
            retries: 10      

  oe.openelis.org:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: openelisglobal-webapp
    image: openelisglobal-webapp.build
    depends_on:
        db.openelis.org:
            condition: service_healthy
        certs:
            condition: service_completed_successfully
    ports:
        - "${OE_WEBAPP_HTTP_PORT:-8080}:8080"
        - "${OE_WEBAPP_HTTPS_PORT:-8443}:8443"
    restart: always
    networks:
      default:
        ipv4_address: 172.20.1.121
    environment:
        - TZ=${TZ:-UTC}
        - OE_DB_PASSWORD=${OE_DB_PASSWORD:-clinlims}
        - OE_ENCRYPTION_PASSWORD=${OE_ENCRYPTION_PASSWORD:-}
        - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD:-kspass}
        - SSL_TRUSTSTORE_PASSWORD=${SSL_TRUSTSTORE_PASSWORD:-tspass}
        - SPRING_LIQUIBASE_CONTEXTS=test
        - ORG_OPENELISGLOBAL_UAT_SCENARIOS_ENABLED=${OE_UAT_SCENARIOS_ENABLED:-false}
        # The EQA scheduler sweep (deadline alerts, and the bridge that carries
        # validated results into a participant cycle and readies it to submit)
        # runs every five minutes in production. The participant E2E lane waits
        # for that sweep, so it runs every ten seconds here.
        - ORG_OPENELISGLOBAL_EQA_ALERT_POLL_FREQUENCY=10000
        # context.xml doesn't seem to be able to pick up environment variables directly, so we are passing them in as CATALINA_OPTS
        - CATALINA_OPTS=-Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims -Ddatasource.username=clinlims -Doe.ssl.truststorepath=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore} -Doe.ssl.keystorepath=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}
    volumes:
        - type: volume
          source: key_trust-store-volume
          target: /etc/openelis-global
          volume:
            nocopy: true
        - ./volume/lucene:/var/lib/lucene_index
        - ./volume/programs/:/var/lib/openelis-global/programs
        - ./volume/logs/oeLogs:/var/lib/openelis-global/logs
        - reporting-data:/var/lib/openelis-global/reporting
        - ./volume/logs/tomcatLogs/:/usr/local/tomcat/logs
        - ./volume/tomcat/oe_server.xml:/usr/local/tomcat/conf/server.xml
        - ./volume/properties/SystemConfiguration.properties:/var/lib/openelis-global/properties/SystemConfiguration.properties
        - ./volume/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
        - ./volume/analyzer/analyzer-test-map.csv:/var/lib/openelis-global/analyzer/analyzer-test-map.csv
        # NOTE: Do NOT bind-mount ./volume/configuration here — it overrides the
        # container's built-in config templates and causes permission errors on
        # checksum files. The container manages its own /var/lib/.../configuration.
        - ./volume/branding:/var/lib/openelis-global/branding
        - ./volume/menu/menu_config.json:/var/lib/openelis-global/menu/menu_config.json
    secrets:
      - source: initial-admin-password
      - source: common.properties
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 2m

  fhir.openelis.org:
    container_name: external-fhir-api
    image: external-fhir-api.build
    build:
      context: .
      dockerfile: ./fhir/Dockerfile
    depends_on:
        db.openelis.org:
            condition: service_healthy
        certs:
            condition: service_completed_successfully
    ports:
        - "${OE_FHIR_HTTP_PORT:-8081}:8080"
        - "${OE_FHIR_HTTPS_PORT:-8444}:8443"
    networks:
        - default
    restart: always
    environment:
        TZ: ${TZ:-UTC}
        JAVA_OPTS: "-Djavax.net.ssl.trustStore=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore}
                        -Djavax.net.ssl.trustStoreType=pkcs12
                        -Djavax.net.ssl.keyStore=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}
                        -Djavax.net.ssl.keyStoreType=pkcs12"
        CATALINA_OPTS: "-Dhapi.ssl.truststorepath=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore} -Dhapi.ssl.keystorepath=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}"
        FHIR_DATASOURCE_URL : "jdbc:postgresql://db.openelis.org:5432/clinlims?currentSchema=clinlims"
        FHIR_DATASOURCE_USERNAME: "clinlims"
        SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-kspass}
        SSL_TRUSTSTORE_PASSWORD: ${SSL_TRUSTSTORE_PASSWORD:-tspass}
        FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD:-clinlims}
        FHIR_SERVER_ADRESS: "http://fhir.openelis.org:8080/fhir/"
    volumes:
      - type: volume
        source: key_trust-store-volume
        target: /etc/openelis-global
        volume:
          nocopy: true
  frontend.openelis.org:
    image: frontend
    # No `target:` → defaults to the final stage of the multi-stage
    # frontend/Dockerfile, which is `runtime` (nginx serving dist/).
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: openelisglobal-front-end
    networks:
        - default
    environment:
        - CHOKIDAR_USEPOLLING=true
    tty: true


  proxy:
    image: openelisglobal-proxy.build
    build:
      context: ./nginx-proxy
      dockerfile: ./Dockerfile
    container_name: openelisglobal-proxy
    ports:
        - "${OE_HTTP_PORT:-80}:80"
        - "${OE_HTTPS_PORT:-443}:443"
    environment:
        - OE_HTTPS_PORT=${OE_HTTPS_PORT:-443}
    command:
        - /bin/sh
        - -c
        - "envsubst '$$OE_HTTPS_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
    volumes:
        - type: volume
          source: certs-vol
          target: /etc/nginx/certs/
          volume:
            nocopy: true
        - type: volume
          source: keys-vol
          target: /etc/nginx/keys/
          volume:
            nocopy: true
        - ./volume/nginx/nginx-prod.conf:/etc/nginx/nginx.conf.template:ro
    networks:
        - default  
    restart: unless-stopped
    depends_on:
       certs:
           condition: service_completed_successfully

secrets:
  initial-admin-password:
    file: ./dev/initial-admin-password
  common.properties:
    file:  ./volume/properties/common.properties

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24

volumes:
  db-data:
  key_trust-store-volume:
  certs-vol:
  keys-vol:
  lucene_index-vol:
  reporting-data:
