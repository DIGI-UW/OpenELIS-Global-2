openapi: 3.0.3
info:
  title: OpenELIS Microbiology MVP API
  version: 0.1.0
  description: Planning contract for the OGC-782 microbiology MVP workflow.
servers:
  - url: /rest
paths:
  /microbiology/worklist:
    get:
      summary: List microbiology cases and AST work requiring action
      parameters:
        - name: grain
          in: query
          schema:
            type: string
            enum: [cultures, ast]
        - name: status
          in: query
          schema:
            type: string
        - name: workflow
          in: query
          schema:
            $ref: "#/components/schemas/MicroWorkflowType"
        - name: stage
          in: query
          schema:
            type: string
        - name: due
          in: query
          schema:
            type: string
        - name: urgency
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Worklist rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklistPage"
        "401":
          description: Authentication required
        "403":
          description: The authenticated user cannot view microbiology cases
  /microbiology/cases/{caseId}:
    get:
      summary: Get compiled microbiology case detail
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroCaseDetail"
        "404":
          description: Case not found
  /microbiology/cases/{caseId}/activities:
    post:
      summary: Record a case activity or observation
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseActivityRequest"
      responses:
        "200":
          description: Activity recorded and case state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroCaseDetail"
        "400":
          description: Invalid activity for case state
  /microbiology/isolates:
    post:
      summary: Record preliminary isolate work-up for a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIsolateRequest"
      responses:
        "200":
          description: Isolate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroIsolate"
  /microbiology/isolates/{isolateId}/identification:
    put:
      summary: Identify or reidentify an isolate
      parameters:
        - $ref: "#/components/parameters/IsolateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyIsolateRequest"
      responses:
        "200":
          description: Updated isolate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroIsolate"
        "400":
          description: Invalid isolate update
  /microbiology/ast/setup:
    get:
      summary: Resolve the ordered AST panel for an identified isolate
      parameters:
        - name: isolateId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-resolved AST setup context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstSetup"
        "400":
          description: Isolate is not identified or its configured panel is unavailable
  /microbiology/ast/panels/{panelId}/antibiotics:
    get:
      summary: List the configured ordered drugs for an AST panel adjustment
      parameters:
        - name: panelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered panel membership
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AstRunAntibiotic"
  /microbiology/ast/runs:
    get:
      summary: List AST runs and readings for an isolate
      parameters:
        - name: isolateId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AST runs with readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AstRun"
    post:
      summary: Start AST for an isolate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstStartRequest"
      responses:
        "200":
          description: AST run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
        "400":
          description: Isolate context is insufficient for AST
        "409":
          description: The requested drug set cannot be reconciled with the selected panel
  /microbiology/ast/runs/{astRunId}/readings:
    post:
      summary: Append a manual AST reading to a run
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstReadingRequest"
      responses:
        "200":
          description: Interpreted AST reading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstReading"
        "400":
          description: Invalid reading payload
  /microbiology/ast/runs/{astRunId}/review:
    post:
      summary: Mark an AST run reviewed
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      responses:
        "200":
          description: Reviewed AST run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
        "400":
          description: AST run is not reviewable
        "409":
          description: One or more ordered drugs has no recorded result
  /microbiology/ast/runs/{astRunId}/analyzer-flags/acknowledge:
    post:
      summary: Acknowledge analyzer expert flags before accepting results
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstReasonRequest"
      responses:
        "200":
          description: AST run with acknowledged analyzer flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
  /microbiology/ast/runs/{astRunId}/qc/override:
    post:
      summary: Record a supervisor QC override before accepting results
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstReasonRequest"
      responses:
        "200":
          description: AST run with the QC resolution retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
  /microbiology/ast/runs/{astRunId}/invalidate-and-repeat:
    post:
      summary: Preserve a failed analyzer run and start its replacement
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstInvalidateRepeatRequest"
      responses:
        "200":
          description: New analyzer-backed AST run awaiting results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
  /microbiology/ast/runs/{astRunId}/attempts:
    post:
      summary: Start a repeat or retest AST run while preserving the source run
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstAttemptRequest"
      responses:
        "200":
          description: Preserved new AST attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
  /microbiology/ast/runs/{astRunId}/reportable:
    post:
      summary: Select a reviewed AST run for reporting
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      responses:
        "200":
          description: Selected reportable AST run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
  /analyzer/events/ast:
    post:
      summary: Receive an idempotent normalized AST result or QC event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstAnalyzerEventRequest"
      responses:
        "202":
          description: Event applied to its AST run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerEvent"
        "422":
          description: Event retained for reconciliation because it could not be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerEvent"
  /analyzer/events/culture:
    post:
      summary: Receive an idempotent normalized positive-culture signal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CultureAnalyzerEventRequest"
      responses:
        "202":
          description: Signal applied to one incubating culture case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerEvent"
        "422":
          description: Signal retained for reconciliation because it could not be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerEvent"
  /microbiology/ast/readings/{readingId}/override:
    put:
      summary: Override an AST interpretation with a required reason
      parameters:
        - $ref: "#/components/parameters/ReadingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstOverrideRequest"
      responses:
        "200":
          description: Updated AST reading with original interpretation retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstReading"
  /microbiology/ast/readings/{readingId}/override/revert:
    post:
      summary: Revert an active AST override with a required reason
      parameters:
        - $ref: "#/components/parameters/ReadingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstRevertRequest"
      responses:
        "200":
          description: AST reading restored to its original interpretation with history retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstReading"
  /microbiology/cases/{caseId}/critical-communications:
    post:
      summary: Log a critical microbiology communication
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriticalCommunicationRequest"
      responses:
        "200":
          description: Communication logged and alert surfaced when configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriticalCommunication"
  /microbiology/cases/{caseId}/nonconformances:
    post:
      summary: Report a case nonconformance or lost specimen
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseNonconformanceRequest"
      responses:
        "200":
          description: Nonconformance recorded and disposition applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNonconformanceResult"
        "400":
          description: Required classification or disposition is invalid
        "409":
          description: Affected case state prevents specimen rejection
  /microbiology/cases/{caseId}/release/preliminary:
    post:
      summary: Release a preliminary microbiology report
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Preliminary release accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroReportRelease"
        "400":
          description: Preliminary release is not allowed
  /microbiology/cases/{caseId}/release/final:
    post:
      summary: Release a final microbiology report
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Final release accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroReportRelease"
        "409":
          description: Case is not final-release ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessFailure"
  /microbiology/surveillance/whonet/readiness:
    get:
      summary: Check finalized microbiology cases for WHONET readiness
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: WHONET readiness report
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/WhonetReadinessRow"
components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    IsolateId:
      name: isolateId
      in: path
      required: true
      schema:
        type: string
    AstRunId:
      name: astRunId
      in: path
      required: true
      schema:
        type: string
    ReadingId:
      name: readingId
      in: path
      required: true
      schema:
        type: string
  schemas:
    MicroWorkflowType:
      type: string
      enum:
        - BACTERIOLOGY
        - MYCOBACTERIOLOGY_TB
        - MYCOLOGY
        - UNASSIGNED
    WorklistPage:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/WorklistRow"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        summary:
          $ref: "#/components/schemas/WorklistSummary"
        recentActivity:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/WorklistRecentActivity"
    WorklistSummary:
      type: object
      properties:
        totalPending:
          type: integer
        incubating:
          type: integer
        positiveSignals:
          type: integer
        growthDetected:
          type: integer
        identification:
          type: integer
        needsAstReview:
          type: integer
        readyForCaseReview:
          type: integer
        openCriticalFollowUps:
          type: integer
        astInQueue:
          type: integer
        astPendingSetup:
          type: integer
        astInProgress:
          type: integer
        astAwaitingResults:
          type: integer
        astResultsIn:
          type: integer
        resistanceHits:
          type: object
          description: Today-scoped counts from structured analyzer flags.
          additionalProperties:
            type: integer
    WorklistRecentActivity:
      type: object
      properties:
        caseId:
          type: string
        accessionNumber:
          type: string
        activityType:
          type: string
        occurredAt:
          type: string
          format: date-time
        performedByDisplay:
          type: string
        note:
          type: string
    WorklistRow:
      type: object
      properties:
        rowId:
          type: string
        grain:
          type: string
          enum: [cultures, ast]
        caseId:
          type: string
        sampleItemId:
          type: string
        accessionNumber:
          type: string
        patientDisplay:
          type: string
        specimenDisplay:
          type: string
        workflowType:
          $ref: "#/components/schemas/MicroWorkflowType"
        stage:
          type: string
        dueAction:
          type: string
        urgency:
          type: string
        priority:
          type: string
        needsAstReview:
          type: boolean
        hasOpenCriticalCommunication:
          type: boolean
        siblingWorkflows:
          type: array
          items:
            type: string
        isolateId:
          type: string
        isolateLabel:
          type: string
        organismDisplay:
          type: string
        astRunId:
          type: string
        panelId:
          type: string
        panelName:
          type: string
        astStatus:
          type: string
        astStartedAt:
          type: string
          format: date-time
        analyzerResultsAvailable:
          type: boolean
        analyzerExpertFlags:
          type: string
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        lastActivityBy:
          type: string
    MicroCaseDetail:
      type: object
      properties:
        id:
          type: string
        sampleItemId:
          type: string
        accessionNumber:
          type: string
        workflowType:
          $ref: "#/components/schemas/MicroWorkflowType"
        stage:
          type: string
        nextAction:
          type: string
        releaseBlockers:
          type: array
          items:
            type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/CaseActivity"
        isolates:
          type: array
          items:
            $ref: "#/components/schemas/MicroIsolate"
        siblingCases:
          type: array
          items:
            $ref: "#/components/schemas/SiblingCase"
    SiblingCase:
      type: object
      properties:
        caseId:
          type: string
        workflowType:
          $ref: "#/components/schemas/MicroWorkflowType"
        stage:
          type: string
    CaseActivityRequest:
      type: object
      required:
        - activityType
      properties:
        activityType:
          type: string
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
        structuredData:
          type: object
          additionalProperties: true
    CaseActivity:
      allOf:
        - $ref: "#/components/schemas/CaseActivityRequest"
        - type: object
          properties:
            id:
              type: string
            performedBy:
              type: string
    CreateIsolateRequest:
      type: object
      required:
        - caseId
        - isolateLabel
        - gramStain
      properties:
        caseId:
          type: string
        isolateLabel:
          type: string
        gramStain:
          type: string
        colonyMorphology:
          type: string
        significance:
          type: string
    IdentifyIsolateRequest:
      type: object
      required:
        - organismId
        - identificationMethod
        - identificationConfidence
        - significance
        - identificationStatus
      properties:
        organismId:
          type: string
        preliminaryOrganismText:
          type: string
        identificationMethod:
          type: string
        identificationConfidence:
          type: number
          minimum: 0
          maximum: 100
        significance:
          type: string
        identificationStatus:
          type: string
        identificationReason:
          type: string
    MicroIsolate:
      type: object
      properties:
        id:
          type: string
        caseId:
          type: string
        isolateLabel:
          type: string
        gramStain:
          type: string
        colonyMorphology:
          type: string
        organismId:
          type: string
        preliminaryOrganismText:
          type: string
        identificationMethod:
          type: string
        identificationConfidence:
          type: number
        significance:
          type: string
        identificationStatus:
          type: string
    AstStartRequest:
      type: object
      required:
        - isolateId
        - panelId
        - breakpointStandardId
        - technique
      properties:
        isolateId:
          type: string
        panelId:
          type: string
        panelAdjustmentReason:
          type: string
          description: Required when the panel or ordered drug membership differs from the upstream order.
        orderedAntibioticIds:
          type: array
          description: Exact ordered drug membership to snapshot when explicitly adjusting the upstream order.
          minItems: 1
          uniqueItems: true
          items:
            type: string
        breakpointStandardId:
          type: string
        technique:
          $ref: "#/components/schemas/AstTechnique"
        lotSelections:
          type: array
          items:
            type: object
        awaitAnalyzerResults:
          type: boolean
          default: false
        analyzerInstrumentId:
          type: string
        analyzerCardId:
          type: string
    AstAttemptRequest:
      type: object
      required:
        - attemptType
        - reason
        - technique
      properties:
        attemptType:
          type: string
          enum:
            - REPEAT
            - RETEST
        reason:
          type: string
        technique:
          $ref: "#/components/schemas/AstTechnique"
        orderedAntibioticIds:
          type: array
          description: Omit for the whole source panel or provide source-run members for a scoped repeat.
          minItems: 1
          uniqueItems: true
          items:
            type: string
    AstReasonRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
    AstInvalidateRepeatRequest:
      type: object
      required:
        - reason
        - analyzerCardId
      properties:
        reason:
          type: string
          minLength: 1
        analyzerCardId:
          type: string
          minLength: 1
    AstAnalyzerEventRequest:
      type: object
      required:
        - externalEventId
        - eventType
        - payload
      properties:
        externalEventId:
          type: string
        eventType:
          type: string
          enum:
            - AST_RESULT_AVAILABLE
            - AST_QC_FAIL
        analyzerId:
          type: string
        sourceId:
          type: string
          description: Analyzer card or panel identifier used when targetRunId is absent.
        targetRunId:
          type: string
        payload:
          $ref: "#/components/schemas/AstAnalyzerResultPayload"
    AstAnalyzerResultPayload:
      type: object
      properties:
        sourceEventId:
          type: string
        analyzerInstrumentId:
          type: string
        analyzerCardId:
          type: string
        analyzerSoftwareVersion:
          type: string
        analyzerOrganismId:
          type: string
        analyzerOrganismName:
          type: string
        analyzerOrganismConfidence:
          type: number
        analyzerExpertFlags:
          type: array
          items:
            type: string
        instrumentQcReference:
          type: string
        qcPassed:
          type: boolean
        loadedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        analyzerMessageCodes:
          type: array
          items:
            type: string
        readings:
          type: array
          items:
            $ref: "#/components/schemas/AstAnalyzerReading"
    AstAnalyzerReading:
      type: object
      required:
        - antibioticId
        - rawValue
      properties:
        antibioticId:
          type: string
        rawValue:
          type: number
        units:
          type: string
        instrumentInterpretation:
          type: string
        analyzerResultReference:
          type: string
    CultureAnalyzerEventRequest:
      type: object
      required:
        - externalEventId
        - eventType
      properties:
        externalEventId:
          type: string
        eventType:
          type: string
          enum:
            - POSITIVE_SIGNAL
        analyzerId:
          type: string
        sourceId:
          type: string
          description: Recorded culture-container identifier used when targetCaseId is absent.
        targetCaseId:
          type: string
        note:
          type: string
    AnalyzerEvent:
      type: object
      properties:
        id:
          type: string
        externalEventId:
          type: string
        eventType:
          type: string
        analyzerId:
          type: string
        sourceId:
          type: string
        targetReference:
          type: string
        status:
          type: string
          enum:
            - RECEIVED
            - APPLIED
            - FAILED
        failureReason:
          type: string
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
        reconciliationUrl:
          type: string
    AstRun:
      type: object
      properties:
        id:
          type: string
        isolateId:
          type: string
        panelId:
          type: string
        panelVersion:
          type: integer
        panelProvenance:
          type: string
          enum:
            - ORGANISM_DEFAULT
            - ADJUSTED
        panelAdjustmentReason:
          type: string
        breakpointStandardId:
          type: string
        breakpointVersion:
          type: string
        technique:
          $ref: "#/components/schemas/AstTechnique"
        measurementType:
          $ref: "#/components/schemas/AstMeasurementType"
        method:
          allOf:
            - $ref: "#/components/schemas/AstMeasurementType"
          deprecated: true
          description: Compatibility alias for measurementType.
        status:
          type: string
          enum:
            - IN_PROGRESS
            - AWAITING_RESULTS
            - RESULTS_IN
            - QC_FAILED
            - RERUN_REQUIRED
            - INVALIDATED
            - REVIEWED
        analyzerInstrumentId:
          type: string
        analyzerCardId:
          type: string
        analyzerSoftwareVersion:
          type: string
        analyzerOrganismId:
          type: string
        analyzerOrganismName:
          type: string
        analyzerOrganismConfidence:
          type: number
        analyzerExpertFlags:
          type: string
        instrumentQcReference:
          type: string
        qcState:
          type: string
        qcOverrideReason:
          type: string
        analyzerFlagsAcknowledgementReason:
          type: string
        analyzerLoadedAt:
          type: string
