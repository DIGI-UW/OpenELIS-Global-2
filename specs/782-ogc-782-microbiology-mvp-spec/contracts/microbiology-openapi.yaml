openapi: 3.0.3
info:
  title: OpenELIS Microbiology MVP API
  version: 0.1.0
  description: Planning contract for the OGC-782 microbiology MVP workflow.
servers:
  - url: /rest
paths:
  /microbiology/worklist:
    get:
      summary: List microbiology cases and AST work requiring action
      parameters:
        - name: workflow
          in: query
          schema:
            $ref: "#/components/schemas/MicroWorkflowType"
        - name: stage
          in: query
          schema:
            type: string
        - name: due
          in: query
          schema:
            type: string
        - name: urgency
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Worklist rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklistPage"
  /microbiology/cases/{caseId}:
    get:
      summary: Get compiled microbiology case detail
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroCaseDetail"
        "404":
          description: Case not found
  /microbiology/cases/{caseId}/activities:
    post:
      summary: Record a case activity or observation
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseActivityRequest"
      responses:
        "200":
          description: Activity recorded and case state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroCaseDetail"
        "400":
          description: Invalid activity for case state
  /microbiology/isolates:
    post:
      summary: Record preliminary isolate work-up for a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIsolateRequest"
      responses:
        "200":
          description: Isolate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroIsolate"
  /microbiology/isolates/{isolateId}/identification:
    put:
      summary: Identify or reidentify an isolate
      parameters:
        - $ref: "#/components/parameters/IsolateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyIsolateRequest"
      responses:
        "200":
          description: Updated isolate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroIsolate"
        "400":
          description: Invalid isolate update
  /microbiology/ast/setup:
    get:
      summary: Resolve the ordered AST panel for an identified isolate
      parameters:
        - name: isolateId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-resolved AST setup context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstSetup"
        "400":
          description: Isolate is not identified or its configured panel is unavailable
  /microbiology/ast/runs:
    get:
      summary: List AST runs and readings for an isolate
      parameters:
        - name: isolateId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AST runs with readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AstRun"
    post:
      summary: Start AST for an isolate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstRunRequest"
      responses:
        "200":
          description: AST run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
        "400":
          description: Isolate context is insufficient for AST
  /microbiology/ast/runs/{astRunId}/readings:
    post:
      summary: Append a manual AST reading to a run
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstReadingRequest"
      responses:
        "200":
          description: Interpreted AST reading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstReading"
        "400":
          description: Invalid reading payload
  /microbiology/ast/runs/{astRunId}/review:
    post:
      summary: Mark an AST run reviewed
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      responses:
        "200":
          description: Reviewed AST run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
        "400":
          description: AST run is not reviewable
  /microbiology/ast/runs/{astRunId}/attempts:
    post:
      summary: Start a repeat or retest AST run while preserving the source run
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstRunRequest"
      responses:
        "200":
          description: Preserved new AST attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
  /microbiology/ast/runs/{astRunId}/reportable:
    post:
      summary: Select a reviewed AST run for reporting
      parameters:
        - $ref: "#/components/parameters/AstRunId"
      responses:
        "200":
          description: Selected reportable AST run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstRun"
  /microbiology/ast/readings/{readingId}/override:
    put:
      summary: Override an AST interpretation with a required reason
      parameters:
        - $ref: "#/components/parameters/ReadingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstOverrideRequest"
      responses:
        "200":
          description: Updated AST reading with original interpretation retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstReading"
  /microbiology/cases/{caseId}/critical-communications:
    post:
      summary: Log a critical microbiology communication
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriticalCommunicationRequest"
      responses:
        "200":
          description: Communication logged and alert surfaced when configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriticalCommunication"
  /microbiology/cases/{caseId}/nonconformances:
    post:
      summary: Report a case nonconformance or lost specimen
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseNonconformanceRequest"
      responses:
        "200":
          description: Nonconformance recorded and disposition applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNonconformanceResult"
        "400":
          description: Required classification or disposition is invalid
        "409":
          description: Affected case state prevents specimen rejection
  /microbiology/cases/{caseId}/release/preliminary:
    post:
      summary: Release a preliminary microbiology report
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Preliminary release accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroReportRelease"
        "400":
          description: Preliminary release is not allowed
  /microbiology/cases/{caseId}/release/final:
    post:
      summary: Release a final microbiology report
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Final release accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroReportRelease"
        "409":
          description: Case is not final-release ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessFailure"
  /microbiology/surveillance/whonet/readiness:
    get:
      summary: Check finalized microbiology cases for WHONET readiness
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: WHONET readiness report
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/WhonetReadinessRow"
components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    IsolateId:
      name: isolateId
      in: path
      required: true
      schema:
        type: string
    AstRunId:
      name: astRunId
      in: path
      required: true
      schema:
        type: string
    ReadingId:
      name: readingId
      in: path
      required: true
      schema:
        type: string
  schemas:
    MicroWorkflowType:
      type: string
      enum:
        - BACTERIOLOGY
        - MYCOBACTERIOLOGY_TB
        - MYCOLOGY
        - UNASSIGNED
    WorklistPage:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/WorklistRow"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        summary:
          type: object
          additionalProperties:
            type: integer
    WorklistRow:
      type: object
      properties:
        caseId:
          type: string
        sampleItemId:
          type: string
        workflowType:
          $ref: "#/components/schemas/MicroWorkflowType"
        stage:
          type: string
        dueAction:
          type: string
        urgency:
          type: string
        needsAstReview:
          type: boolean
        hasOpenCriticalCommunication:
          type: boolean
        siblingWorkflows:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    MicroCaseDetail:
      type: object
      properties:
        id:
          type: string
        sampleItemId:
          type: string
        accessionNumber:
          type: string
        workflowType:
          $ref: "#/components/schemas/MicroWorkflowType"
        stage:
          type: string
        nextAction:
          type: string
        releaseBlockers:
          type: array
          items:
            type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/CaseActivity"
        isolates:
          type: array
          items:
            $ref: "#/components/schemas/MicroIsolate"
        siblingCases:
          type: array
          items:
            $ref: "#/components/schemas/SiblingCase"
    SiblingCase:
      type: object
      properties:
        caseId:
          type: string
        workflowType:
          $ref: "#/components/schemas/MicroWorkflowType"
        stage:
          type: string
    CaseActivityRequest:
      type: object
      required:
        - activityType
      properties:
        activityType:
          type: string
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
        structuredData:
          type: object
          additionalProperties: true
    CaseActivity:
      allOf:
        - $ref: "#/components/schemas/CaseActivityRequest"
        - type: object
          properties:
            id:
              type: string
            performedBy:
              type: string
    CreateIsolateRequest:
      type: object
      required:
        - caseId
        - isolateLabel
        - gramStain
      properties:
        caseId:
          type: string
        isolateLabel:
          type: string
        gramStain:
          type: string
        colonyMorphology:
          type: string
        significance:
          type: string
    IdentifyIsolateRequest:
      type: object
      required:
        - organismId
        - identificationMethod
        - identificationConfidence
        - significance
        - identificationStatus
      properties:
        organismId:
          type: string
        preliminaryOrganismText:
          type: string
        identificationMethod:
          type: string
        identificationConfidence:
          type: number
          minimum: 0
          maximum: 100
        significance:
          type: string
        identificationStatus:
          type: string
        identificationReason:
          type: string
    MicroIsolate:
      type: object
      properties:
        id:
          type: string
        caseId:
          type: string
        isolateLabel:
          type: string
        gramStain:
          type: string
        colonyMorphology:
          type: string
        organismId:
          type: string
        preliminaryOrganismText:
          type: string
        identificationMethod:
          type: string
        identificationConfidence:
          type: number
        significance:
          type: string
        identificationStatus:
          type: string
    AstRunRequest:
      type: object
      properties:
        isolateId:
          type: string
        panelId:
          type: string
        panelAdjustmentReason:
          type: string
        breakpointStandardId:
          type: string
        lotSelections:
          type: array
          items:
            type: object
    AstRun:
      type: object
      properties:
        id:
          type: string
        isolateId:
          type: string
        panelId:
          type: string
        panelVersion:
          type: integer
        panelProvenance:
          type: string
          enum:
            - ORGANISM_DEFAULT
            - ADJUSTED
        panelAdjustmentReason:
          type: string
        breakpointStandardId:
          type: string
        breakpointVersion:
          type: string
        method:
          type: string
        status:
          type: string
        readings:
          type: array
          items:
            $ref: "#/components/schemas/AstReading"
    AstSetup:
      type: object
      properties:
        isolateId:
          type: string
        orderedPanelId:
          type: string
        orderedPanelLabel:
          type: string
        orderedPanelVersion:
          type: integer
        panelProvenance:
          type: string
          enum:
            - ORGANISM_DEFAULT
            - UNASSIGNED
    AstReadingRequest:
      type: object
      required:
        - antibioticId
        - method
        - rawValue
      properties:
        antibioticId:
          type: string
        method:
          type: string
          enum:
            - MIC
            - ZONE
        rawValue:
          type: number
    AstReading:
      type: object
      properties:
        id:
          type: string
        astRunId:
          type: string
        antibioticId:
          type: string
        method:
          type: string
        rawValue:
          type: number
        interpretation:
          type: string
        breakpointRuleId:
          type: string
        source:
          type: string
          enum:
            - MANUAL_ENTRY
            - ANALYZER_AUTO
            - OVERRIDE
        matchedBy:
          type: string
          enum:
            - SPECIMEN
            - ORGANISM
            - GROUP
            - NONE
        units:
          type: string
        overrideInterpretation:
          type: string
        overrideReason:
          type: string
    AstOverrideRequest:
      type: object
      required:
        - overrideInterpretation
        - overrideReason
      properties:
        overrideInterpretation:
          type: string
        overrideReason:
          type: string
    CriticalCommunicationRequest:
      type: object
      required:
        - targetType
        - targetId
        - recipient
        - message
        - communicationMethod
      properties:
        targetType:
          type: string
        targetId:
          type: string
        recipient:
          type: string
        recipientContact:
          type: string
        message:
          type: string
        communicationMethod:
          type: string
        followUpNeeded:
          type: boolean
    CriticalCommunication:
      allOf:
        - $ref: "#/components/schemas/CriticalCommunicationRequest"
        - type: object
          properties:
            id:
              type: string
            acknowledgementStatus:
              type: string
            communicatedAt:
              type: string
              format: date-time
            alertId:
              type: integer
              format: int64
    CaseNonconformanceRequest:
      type: object
      required:
        - categoryId
        - reportingUnitId
        - severity
        - description
        - disposition
        - eventType
      properties:
        categoryId:
          type: string
        typeId:
          type: string
        reportingUnitId:
          type: integer
        severity:
          type: string
        title:
          type: string
        description:
          type: string
        immediateAction:
          type: string
        disposition:
          type: string
          enum:
            - FLAG_ONLY
            - REJECT_TEST
        eventType:
          type: string
          enum:
            - NONCONFORMANCE
            - SPECIMEN_LOST
    CaseNonconformanceResult:
      type: object
      properties:
        nceId:
          type: string
        nceNumber:
          type: string
        disposition:
          type: string
        eventType:
          type: string
        affectedCaseIds:
          type: array
          items:
            type: string
    MicroReportRelease:
      type: object
      properties:
        caseId:
          type: string
        finalReleaseState:
          type: string
        stage:
          type: string
        closedAt:
          type: string
          format: date-time
        closedBy:
          type: string
    ReadinessFailure:
      type: object
      properties:
        caseId:
          type: string
        blockers:
          type: array
          items:
            type: string
    WhonetReadinessRow:
      type: object
      properties:
        caseId:
          type: string
        ready:
          type: boolean
        missingMappings:
          type: array
          items:
            type: string
