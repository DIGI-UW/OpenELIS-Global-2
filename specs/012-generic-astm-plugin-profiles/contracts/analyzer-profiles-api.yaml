openapi: 3.0.3
info:
  title: OpenELIS Shipped Analyzer Profiles API
  version: 1.0.0
  description: >
    Current filesystem-profile and analyzer-instance contract. Profiles are
    read-only shipped files. There is no profile CRUD, import/export, reapply,
    or persisted profile-library API in the MVP.
servers:
  - url: /rest/analyzer

paths:
  /profiles:
    get:
      summary: List shipped ASTM, HL7, and FILE profile summaries
      responses:
        "200":
          description: Shipped profile summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileSummary"

  /profiles/{protocol}/{name}:
    get:
      summary: Read one shipped profile
      parameters:
        - in: path
          name: protocol
          required: true
          schema:
            type: string
            enum: [astm, hl7, file]
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile detail
        "404":
          description: Profile not found

  /analyzers:
    post:
      summary: Create an analyzer and optionally apply shipped defaults once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzerCreateRequest"
      responses:
        "201":
          description: Analyzer created
        "400":
          description: Invalid analyzer or profile selection

  /analyzers/{analyzerId}/plugin-config:
    get:
      summary: Read analyzer-specific plugin configuration
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
      responses:
        "200":
          description: Plugin config

  /analyzers/{analyzerId}/pending-codes:
    get:
      summary: List analyzer codes awaiting mapping
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
      responses:
        "200":
          description: Pending codes

  /analyzers/{analyzerId}/result-value-mappings:
    get:
      summary: Read analyzer-specific result-value mappings
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
      responses:
        "200":
          description: Result-value mappings
    put:
      summary: Replace analyzer-specific result-value mappings
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
      responses:
        "200":
          description: Mappings saved
        "400":
          description: Invalid catalog binding

  /analyzers/{analyzerId}/result-value-options:
    get:
      summary: List active result options for a mapped OpenELIS test
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
        - in: query
          name: testCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Valid catalog options

  /analyzers/{analyzerId}/pending-result-values:
    get:
      summary: List qualitative values awaiting catalog binding
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
      responses:
        "200":
          description: Pending qualitative values

  /analyzers/{analyzerId}/pending-result-values/{pendingId}/resolve:
    post:
      summary: Resolve a pending value to a valid catalog option
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
        - in: path
          name: pendingId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openelisResultOptionId]
              properties:
                openelisResultOptionId:
                  type: string
      responses:
        "200":
          description: Pending value resolved
        "400":
          description: Inactive or wrong-test option

  /analyzers/{analyzerId}/setup-verification:
    get:
      summary: Read current/stale mapping and QC verification
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
      responses:
        "200":
          description: Verification state
    post:
      summary: Verify the current mapping and QC fingerprints
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
      responses:
        "200":
          description: Verification recorded and audited
        "400":
          description: Configuration is incomplete

  /analyzers/{analyzerId}/qc-rules:
    get:
      summary: List analyzer QC rules
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
      responses:
        "200":
          description: QC rules
    post:
      summary: Create an analyzer QC rule
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
      responses:
        "201":
          description: Rule created and bridge registration resynchronized

  /analyzers/{analyzerId}/qc-rules/{ruleId}:
    put:
      summary: Update an analyzer QC rule
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
        - in: path
          name: ruleId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rule updated and bridge registration resynchronized
    delete:
      summary: Delete an analyzer QC rule
      parameters:
        - $ref: "#/components/parameters/AnalyzerId"
        - in: path
          name: ruleId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Rule deleted and bridge registration resynchronized

components:
  parameters:
    AnalyzerId:
      in: path
      name: analyzerId
      required: true
      schema:
        type: string

  schemas:
    ProfileSummary:
      type: object
      required:
        - profileId
        - displayName
        - protocol
        - readinessStatus
      properties:
        profileId:
          type: string
          example: astm/genexpert-astm
        displayName:
          type: string
        protocol:
          type: string
          enum: [ASTM, HL7, FILE]
        category:
          type: string
        supportedConnectionMode:
          type: string
        testMappingCount:
          type: integer
        qcRuleCount:
          type: integer
        resultValueMappingCount:
          type: integer
        readinessStatus:
          type: string
          enum: [DRAFT, PENDING, READY]

    AnalyzerCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        defaultConfigId:
          type: string
          description: >
            Shipped profile ID. Defaults are copied once during creation and
            are not live-linked or reapplied during analyzer edit.
