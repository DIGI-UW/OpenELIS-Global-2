worker_processes 1;

events { worker_connections 1024; }
http {
    # A proxy in front of this one keeps the host it reports.
    map $http_x_forwarded_host $oe_forwarded_host {
        default $http_x_forwarded_host;
        ''      $http_host;
    }
    server {
        listen 80;
        server_name _;
        # Rendered at start: OE_HTTPS_PORT is the HTTPS port users open (default 443).
        return 301 https://$host:${OE_HTTPS_PORT}$request_uri;
    }

    server {
        listen [::]:443 ssl;
        listen 443 ssl default;
        server_name __;

        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;

        proxy_set_header X-Forwarded-For $proxy_protocol_addr; # To forward the original client's IP address
        proxy_set_header X-Forwarded-Proto $scheme; # to forward the  original protocol (HTTP or HTTPS)
        proxy_set_header Host $http_host; # retain the external port for isolated local CI

       absolute_redirect off;

        location / {
            proxy_pass http://frontend.openelis.org;
            proxy_redirect     off;
        }

        location /api/ {
            proxy_pass         https://oe.openelis.org:8443/api/;
            proxy_redirect     off;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $oe_forwarded_host;
        }
    }
}
