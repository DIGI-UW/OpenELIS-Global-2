<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI assistant</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main id="app" class="ai" data-state="loading">
  <header class="ai__head">
    <span id="quota" class="ai__quota" data-testid="ai-quota"></span>
    <button id="new" type="button" class="ai__link" data-testid="ai-new"></button>
  </header>
  <p id="note" class="ai__note"></p>
  <div id="previous" class="ai__previous" hidden>
    <button id="continue" type="button" class="ai__link" data-testid="ai-continue"></button>
  </div>
  <section id="log" class="ai__log" aria-live="polite" data-testid="ai-log"></section>
  <section id="suggestions" class="ai__suggestions" data-testid="ai-suggestions"></section>
  <p id="error" class="ai__error" role="alert" hidden data-testid="ai-error"></p>
  <form id="form" class="ai__form">
    <textarea id="question" rows="2" maxlength="1000" data-testid="ai-question"></textarea>
    <button id="send" type="submit" class="ai__send" data-testid="ai-send"></button>
  </form>
  <footer id="disclaimer" class="ai__foot" data-testid="ai-disclaimer"></footer>
</main>
<script src="markdown.js"></script>
<script src="panel.js"></script>
</body>
</html>
