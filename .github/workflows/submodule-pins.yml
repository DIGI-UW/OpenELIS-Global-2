name: Validation / Submodule pins

# OE2 builds and ships the Bridge and mock images from their submodule pins. A pull request
# into develop must pin commits already merged in those repositories; pull requests into
# other branches, such as a stack, may pin unmerged work while it is being tested together.
on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: submodule-pins-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  submodule-pins:
    name: Analyzer submodules are merged upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/submodule_pins.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
