on:
  workflow_dispatch:
  push:
    branches: [develop]

name: Localization / Transifex / Push

jobs:
  push-translations-to-transifex:
    if: ${{ github.repository == 'DIGI-UW/OpenELIS-Global-2' }}
    name: Run

    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - uses: actions/checkout@v6
      - name: Push source file using transifex client
        uses: transifex/cli-action@v2
        with:
          token: ${{ secrets.TRANSIFEX_TOKEN }}
          # Without a TTY the CLI truncates every message to 78 characters,
          # which hides upload errors; --silent prints errors untruncated.
          args: push --silent
