name: Validation / i18n

on:
  pull_request:
    paths:
      - "frontend/src/languages/**"
      - "scripts/ci/check-i18n-plurals.py"
      - "scripts/ci/check-shipped-display-keys.py"
      - "volume/configuration/backend/nce-categories/**"
      - "volume/configuration/backend/nce-types/**"
      - "volume/configuration/backend/dictionaries/**"
      - "src/main/resources/configuration/dictionaries/**"
      - ".github/workflows/i18n-check.yml"

jobs:
  check-duplicate-keys:
    name: Duplicate key check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for duplicate i18n keys
        run: |
          python3 -c "
          import json, sys, glob
          errors = []
          for f in sorted(glob.glob('frontend/src/languages/*.json')):
              pairs = json.loads(open(f).read(), object_pairs_hook=lambda p: p)
              seen = set()
              dupes = [k for k, v in pairs if k in seen or seen.add(k)]
              if dupes:
                  errors.append(f'{f}: {len(dupes)} duplicate keys (first: {dupes[0]})')
          if errors:
              for e in errors: print(f'::error::{e}')
              sys.exit(1)
          print('All i18n files OK — no duplicate keys')
          "

      - name: Check plural values Transifex can parse
        run: python3 scripts/ci/check-i18n-plurals.py frontend/src/languages/en.json

      # OGC-1507: shipped NCE and dictionary values show through their display
      # keys, so every key a shipped configuration file names must be in en.json.
      - name: Check shipped display keys exist in en.json
        run: python3 scripts/ci/check-shipped-display-keys.py

  check-translation-source:
    name: Translation source-of-truth check
    # Transifex syncs edit the other locales by design. So does promoting this
    # repository's own develop to another branch: develop's locale files came in
    # through those syncs and every other change passed this check on its way in
    # (PR #4772 develop -> main failed on 40+ synced files). A fork's branch named
    # develop is still checked.
    if: >-
      github.head_ref != 'chore/update-transifex' &&
      !(github.head_ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure only en.json is modified (translations belong on Transifex)
        run: |
          python3 -c "
          import subprocess, sys

          base = 'origin/' + '${{ github.base_ref }}'
          result = subprocess.run(
              ['git', 'diff', '--name-only', base + '...HEAD', '--',
               'frontend/src/languages/'],
              capture_output=True, text=True, check=True)
          changed = [f for f in result.stdout.strip().split('\n') if f.strip()]

          non_english = [f for f in changed
                         if f.endswith('.json') and not f.endswith('/en.json')]

          if non_english:
              print('::error::Non-English translation files were modified in this PR.')
              print('::error::Translations should be done on Transifex, not in code.')
              print('::error::Only frontend/src/languages/en.json should be edited by developers.')
              print()
              print('Files that should not be modified:')
              for f in non_english:
                  print(f'  - {f}')
              print()
              print('If you added new i18n keys, add them ONLY to en.json.')
              print('Translators will provide translations via Transifex.')
              print()
              print('If this is a Transifex sync PR, ensure it uses the')
              print('chore/update-transifex branch (auto-bypasses this check).')
              sys.exit(1)
          print('i18n source-of-truth OK — only en.json modified')
          "
