name: Validation / i18n

on:
  pull_request:
    paths:
      - "frontend/src/languages/**"
      - "scripts/ci/validate-i18n.py"
      - ".github/workflows/i18n-check.yml"

jobs:
  check-duplicate-keys:
    name: Duplicate key check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for duplicate i18n keys
        run: python3 scripts/ci/validate-i18n.py --mode duplicates

  check-translation-source:
    name: Translation source-of-truth check
    if: github.head_ref != 'chore/update-transifex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure translations belong on Transifex
        env:
          BASE_REF: origin/${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/ci/validate-i18n.py --mode source --base "$BASE_REF" --branch "$SOURCE_BRANCH"
