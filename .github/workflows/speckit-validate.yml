name: Validation / SpecKit
on:
  pull_request:
    # Run on PRs to any branch when command or skill sources change
    paths:
      - ".specify/**"
      - ".ai/**"
      - ".cursor/**"
      - ".claude/**"
      - "scripts/install-agent-skills.py"
      - "scripts/install-speckit-commands.py"
      - "scripts/ci/validate-agent-assets.sh"
      - ".github/workflows/speckit-validate.yml"
  push:
    branches: [develop]
    paths:
      - ".specify/**"
      - ".ai/**"
      - "scripts/install-agent-skills.py"
      - "scripts/install-speckit-commands.py"
      - "scripts/ci/validate-agent-assets.sh"
      - ".github/workflows/speckit-validate.yml"
  workflow_dispatch:

jobs:
  validate-speckit-commands:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile and validate agent commands and skills
        run: bash scripts/ci/validate-agent-assets.sh
