name: 01 - Backend

on:
  push:
    branches: [develop]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that PR's run still in progress. Other
# events get a group of their own, so develop pushes, releases and manual runs
# are never cancelled. The literal prefix keeps the group distinct when this
# workflow is called from another one.
concurrency:
  group: backend-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Gate the expensive Maven build behind a path filter. On pull_request,
  # skip backend-verify entirely when no backend-relevant files changed.
  # On push to develop, release, and workflow_dispatch the filter step is skipped
  # and the `|| 'true'` fallback forces a full build so the JaCoCo badge
  # and Pages publish steps always run on merge.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.stack.outputs.deferred == 'true' && 'false' || steps.filter.outputs.backend || 'true' }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
      # GitHub runs every pull request in a stack as if it targeted the stack's
      # base, so a 20-PR stack would run Build + Test 20 times per push. The top
      # pull request contains every commit of the stack, so its run covers them
      # all; a pull request below the top skips Build + Test and the checkpoint
      # passes as it does for a change outside the backend paths. The top's own
      # diff is one layer, so its path filter runs against the stack's base
      # instead (see the filter step). Missing or malformed stack metadata runs
      # Build + Test with the ordinary filter.
      - name: Decide stack scope
        id: stack
        if: github.event_name == 'pull_request'
        env:
          POSITION: ${{ github.event.pull_request.stack.position }}
          SIZE: ${{ github.event.pull_request.stack.size }}
          STACK: ${{ github.event.pull_request.stack.number }}
        run: |
          if [[ "$POSITION" =~ ^[0-9]+$ && "$SIZE" =~ ^[0-9]+$ && "$POSITION" -ge 1 && "$SIZE" -ge 1 ]]; then
            if [[ "$POSITION" -lt "$SIZE" ]]; then
              echo "Stacked PR $POSITION of $SIZE (stack #$STACK); Build + Test runs on the top of the stack"
              echo "deferred=true" >> "$GITHUB_OUTPUT"
              echo "top=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Top of stack #$STACK ($POSITION of $SIZE); paths are compared against the stack's base"
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            echo "top=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deferred=false" >> "$GITHUB_OUTPUT"
          echo "top=false" >> "$GITHUB_OUTPUT"
      # With a token the filter reads the pull request's own files, which for
      # the top of a stack is one layer; with no token it diffs the checkout
      # against `base` with git, and the stack's base gives the whole stack.
      - name: Detect backend paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          token: ${{ steps.stack.outputs.top != 'true' && github.token || '' }}
          base: ${{ steps.stack.outputs.top == 'true' && github.event.pull_request.stack.base.ref || '' }}
          filters: |
            backend:
              - 'src/**'
              - 'pom.xml'
              - 'dataexport/**'
              - 'fhir/**'
              - 'Dockerfile'
              - 'build.docker-compose.yml'
              - 'docker-compose.yml'
              - 'dev.docker-compose.yml'
              - 'docker-compose.letsencrypt.yml'
              - '.github/ci/ci.analyzer-harness.yml'
              - '.github/workflows/backend.yml'
              - '.github/scripts/publish-checkpoints*.cjs'

  backend-verify:
    name: Build + Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Checkout OpenELIS-Global2
        uses: actions/checkout@v6
        with:
          repository: ${{github.repository}}
          submodules: recursive

      - name: check formatting
        run: mvn spotless:check

      - name: Test publication checkpoint gate
        run: node --test .github/scripts/publish-checkpoints.test.cjs

      - name: Enforce no @PreAuthorize on controllers (S011c)
        run: |
          # Authorization must live on service interfaces, not controllers.
          # Exceptions:
          #  - LoggingController: mutates runtime log config directly, no service.
          #  - SampleTypeManagementRestController: admin management surface.
          #  - /api-mapped controllers (labelpreset): the ModuleAuthenticationInterceptor
          #    auto-allows the /api prefix for any authenticated user, so a controller-level
          #    @PreAuthorize is their only authorization (enforced by
          #    AutoAllowedPathAuthorizationTest) and cannot move to the service layer.
          #  - UnifiedSystemUserRestController: same auto-allow rationale as the /api
          #    controllers above, for /rest. isRestFullPath() also auto-allows /rest, so
          #    the user-administration GET/POST (which read and write ANY user's identity,
          #    account state and role assignments by caller-supplied id) have no module
          #    check standing behind them. Their service calls are gated, but the read
          #    path aggregates several services whose individual privileges are weaker
          #    than "administer users", so the boundary belongs at the controller.
          #  - ImportController: /import has no system_module_url row, so the interceptor
          #    denies it for non-admins; the class-level guard is defence-in-depth over
          #    the already-gated OrganizationImportService/ProviderImportService calls.
          # NOTE: the entries below this line are pre-existing debt inherited from
          # develop (vector, compliance, referral, dictionary, sampleacceptance,
          # requester, notification, testconfiguration, labunit modules). They predate
          # this check being added and are excluded so the gate reflects NEW violations
          # only. Removing them is tracked separately, not in the RBAC migration.
          # NOTE: the QA/QC/accreditation/analyzer/reports/menu/esig controllers
          # in the list below arrived with develop's own features. Verified
          # develop-side: this branch carries zero @PreAuthorize on each of
          # them. Same inherited-debt category as the blocks above.
          # NOTE: ResultEntryRestController and
          # NotificationTriggerConfigRestController: develop added six
          # hasRole('RESULTS')/hasAnyRole gates there after this branch removed
          # them in favour of service-layer gating. They are left in place
          # rather than stripped: the handlers reach services whose own gates
          # were not verified as equivalent, and removing a working gate to
          # satisfy a lint rule is the wrong trade. Note they carry the
          # inheriting-role problem (a Results Validator holding result:enter is
          # refused by hasRole('RESULTS')), tracked with the route-guard debt in
          # routeGuards.test.js.
          # NOTE: InventoryLotStorageRestController carries develop's
          # hasAnyRole('RECEPTION','RESULTS','ADMIN') from #4377. It is not
          # redundant with the PRIV_STORAGE_VIEW/MANAGE gates on
          # SampleStorageService: develop's
          # InventoryLotStorageAuthorizationSecurityTest is the authorization
          # contract for that screen and asserts by ROLE, with mock users that
          # hold no PRIV_* authorities, so removing the annotation made it 500.
          # Exempted rather than converted; the service gates still apply.
          # NOTE: every exemption below is a `| grep -v` link in one pipeline.
          # A comment between those lines ends the command and makes bash fail
          # on the next `|`, so explanations belong here, not inline.
          # NOTE: the EQA controllers below arrived from develop with EQA V2
          # (OGC-608/609), which gates authorization at the controller layer via
          # EQAGuards against the parallel qa.* permission model. Its 59 guards
          # express five tiers (read, manage, provider, participant, unblind)
          # per handler, and EQAGuards.UNBLIND is not a gate at all:
          # EQAPanelRestController.callerCanUnblind() reads the authority
          # imperatively and passes the result into
          # panelService.getSampleDtos(id, canUnblind) to decide whether sealed
          # proficiency-test targets are revealed. Converting that to a service
          # annotation would change blinding behaviour, so EQA is exempted here
          # and tracked for the EQA/RBAC reconciliation instead. The services
          # underneath still carry @CrudPrivileges, so EQA is gated at both
          # layers today; 012-004t keeps the two models' grants in step.
          violations=$(grep -rn "^\s*@PreAuthorize" src/main/java \
            --include="*Controller.java" \
            -l | grep -v "LoggingController.java" \
               | grep -v "SampleTypeManagementRestController.java" \
               | grep -v "LabelPresetRestController.java" \
               | grep -v "OrderEntryLabelRequestController.java" \
               | grep -v "OrderLabelReprintController.java" \
               | grep -v "SiteWideBarcodeSettingsRestController.java" \
               | grep -v "UnifiedSystemUserRestController.java" \
               | grep -v "ImportController.java" \
               | grep -v "SampleAcceptanceRestController.java" \
               | grep -v "VectorIdentificationRestController.java" \
               | grep -v "VectorDeconvolutionRestController.java" \
               | grep -v "VectorSpeciesRestController.java" \
               | grep -v "VectorSamplingSiteRestController.java" \
               | grep -v "VectorTrapTypeRestController.java" \
               | grep -v "VectorSurveillanceRestController.java" \
               | grep -v "ManualEntryFieldMapRestController.java" \
               | grep -v "LabUnitManagementRestController.java" \
               | grep -v "RequestorRestController.java" \
               | grep -v "ComplianceThresholdRestController.java" \
               | grep -v "ComplianceTestCatalogRestController.java" \
               | grep -v "ComplianceDashboardRestController.java" \
               | grep -v "ComplianceStandardRestController.java" \
               | grep -v "ComplianceReportRestController.java" \
               | grep -v "TestComplianceThresholdRestController.java" \
               | grep -v "ReferenceLabResultsRestController.java" \
               | grep -v "ReferralSubcontractDispatchRestController.java" \
               | grep -v "DictionaryRestController.java" \
               | grep -v "TestSectionEditRestController.java" \
               | grep -v "EQAAlertRestController.java" \
               | grep -v "EQAAnalystCompetencyRestController.java" \
               | grep -v "EQACycleRestController.java" \
               | grep -v "EQAEnrollmentRestController.java" \
               | grep -v "EQAFollowupRestController.java" \
               | grep -v "EQALabPerformanceRestController.java" \
               | grep -v "EQAMyProgramsRestController.java" \
               | grep -v "EQAOrdersRestController.java" \
               | grep -v "EQAPanelReceiptRestController.java" \
               | grep -v "EQAPanelRestController.java" \
               | grep -v "EQAParticipantResultRestController.java" \
               | grep -v "EQAProgramRestController.java" \
               | grep -v "EQAResultRestController.java" \
               | grep -v "EQAShipmentRestController.java" \
               | grep -v "EQASubmissionRestController.java" \
               | grep -v "EQADistributionRestController.java" \
               | grep -v "NceEnhancementRestController.java" \
               | grep -v "CriticalCallbackRestController.java" \
               | grep -v "QiConfigRestController.java" \
               | grep -v "AccreditationRestController.java" \
               | grep -v "ElectronicSignatureRestController.java" \
               | grep -v "BatchWorkplanRestController.java" \
               | grep -v "QaOverviewRestController.java" \
               | grep -v "MenuController.java" \
               | grep -v "ProgramController.java" \
               | grep -v "AnalyzerUpgradeRestController.java" \
               | grep -v "AnalyzerDeliveryIssuesRestController.java" \
               | grep -v "BenchQCResultRestController.java" \
               | grep -v "QCExportRestController.java" \
               | grep -v "QCRestController.java" \
               | grep -v "AmendmentReportRestController.java" \
               | grep -v "RejectionReportRestController.java" \
               | grep -v "FhirReplayRestController.java" \
               | grep -v "ResultEntryRestController.java" \
               | grep -v "NotificationTriggerConfigRestController.java" \
               | grep -v "InventoryLotStorageRestController.java" || true)
          if [ -n "$violations" ]; then
            echo "ERROR: @PreAuthorize found on controller(s) — move authorization to the service interface:"
            echo "$violations"
            exit 1
          fi
          echo "Controller @PreAuthorize check passed."

      - name: Enforce no hardcoded role-name strings (T045)
        run: |
          # Role names live in Constants.java (and Liquibase seed XML) only.
          # Two patterns: (a) role-lookup APIs called with a string literal,
          # (b) the distinctive multi-word role names anywhere in main Java.
          violations=$(grep -rnE 'getRoleByName\("|getSystemRole\("|addAuthoritiesForRole\("|ROLE_NAMES\.add\("' \
            src/main/java --include="*.java" | grep -v "Constants.java" || true)
          names=$(grep -rnE '"(Global Administrator|User Account Administrator|Analyser Import|EQA Coordinator|Audit Trail)"' \
            src/main/java --include="*.java" | grep -v "Constants.java" || true)
          if [ -n "$violations" ] || [ -n "$names" ]; then
            echo "ERROR: hardcoded role name found — use Constants.ROLE_* instead:"
            echo "$violations"
            echo "$names"
            exit 1
          fi
          echo "Role-name string check passed."

      - name: Initialize and build submodules
        run: |
          cd dataexport
          mvn clean install
          cd ..

      - name: Build main project
        run: mvn clean install -Dspotless.check.skip=true

      - name: Preserve backend and existing-data upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Scan repository dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-results.txt
          exit-code: 0
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          trivyignores: .trivyignore

      - name: Generate backend SBOM
        if: always()
        uses: anchore/sbom-action@v0
        with:
          file: target/OpenELIS-Global.war
          output-file: sbom.spdx.json
          artifact-name: openelis-backend-sbom.spdx.json
          dependency-snapshot: ${{ github.event_name == 'push' }}

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-security-reports
          path: |
            trivy-results.txt
            sbom.spdx.json

      - name: Generate JaCoCo Badge
        if: github.event_name == 'push'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: target/html/badges

      - name: Fix permissions
        if: github.event_name == 'push'
        run: |
          sudo chown -R "$(whoami)":"$(whoami)" target/html
          sudo chmod -R 755 target/html  # Read-write for owner, read for others

      - name: Check coverage report exists
        if: github.event_name == 'push'
        run: ls -lah target/html || echo "Coverage report not found!"

      - name: Publish coverage report to GitHub Pages
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/html/

  backend-checkpoint:
    name: 01 Checkpoint - Backend
    if: always()
    needs: [changes, backend-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check backend result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-verify.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$BACKEND_RESULT" != "success" && "$BACKEND_RESULT" != "skipped" ]]; then
            echo "Backend verification failed: $BACKEND_RESULT"
            exit 1
          fi
          echo "Backend checkpoint passed (changes=$CHANGES_RESULT, verify=$BACKEND_RESULT)."
