name: 01 - Backend

on:
  push:
    branches: [develop]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that PR's run still in progress. Other
# events get a group of their own, so develop pushes, releases and manual runs
# are never cancelled. The literal prefix keeps the group distinct when this
# workflow is called from another one.
concurrency:
  group: backend-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      # The formatter comes from download.eclipse.org; when that site does not
      # answer, the same pinned release is fetched from an Eclipse mirror.
      - name: Check formatting
        run: |
          if curl -fsSL --max-time 30 https://download.eclipse.org/eclipse/updates/4.26/p2.index | grep -q '^version='; then
            mvn spotless:check
          else
            echo "::warning::download.eclipse.org is unavailable; using the eclipse-p2-mirror profile"
            mvn -Peclipse-p2-mirror spotless:check
          fi

  deployment-contract:
    uses: ./.github/workflows/deployment-checks.yml
    permissions:
      contents: read

  analyzer-components:
    uses: ./.github/workflows/analyzer-components.yml
    permissions:
      contents: read

  # Gate the expensive Maven build behind a path filter. On pull_request,
  # skip the backend tests entirely when no backend-relevant files changed.
  # On push to develop, release, and workflow_dispatch the filter step is skipped
  # and the `|| 'true'` fallback forces the single full run so the JaCoCo badge
  # and Pages publish steps always run on merge.
  #
  # Pull requests can also run the tests as deterministic shards, planned by
  # .github/scripts/backend_test_shards.py from .github/ci/backend-test-shards.json.
  # Its "mode" decides who gates the pull request: "off" keeps the single full
  # run only, "shadow" keeps the single full run as the gate and runs the
  # shards beside it for comparison, "required" makes the shards the gate and
  # runs the single full run only for test-infrastructure changes or when the
  # pull request carries the ci:full-backend label. In "shadow" and "required"
  # the @IsolatedDatabase classes run in their own job.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.stack.outputs.deferred == 'true' && 'false' || steps.filter.outputs.backend || 'true' }}
      full: ${{ steps.plan.outputs.full }}
      full_scope: ${{ steps.plan.outputs.full_scope }}
      isolated: ${{ steps.plan.outputs.isolated }}
      shards: ${{ steps.plan.outputs.shards }}
      shards_required: ${{ steps.plan.outputs.shards_required }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
      # GitHub runs every pull request in a stack as if it targeted the stack's
      # base, so a 20-PR stack would run Build + Test 20 times per push. The top
      # pull request contains every commit of the stack, so its run covers them
      # all; a pull request below the top skips Build + Test and the checkpoint
      # passes as it does for a change outside the backend paths. The top's own
      # diff is one layer, so its path filter runs against the stack's base
      # instead (see the filter step). Missing or malformed stack metadata runs
      # Build + Test with the ordinary filter.
      - name: Decide stack scope
        id: stack
        if: github.event_name == 'pull_request'
        env:
          POSITION: ${{ github.event.pull_request.stack.position }}
          SIZE: ${{ github.event.pull_request.stack.size }}
          STACK: ${{ github.event.pull_request.stack.number }}
        run: |
          if [[ "$POSITION" =~ ^[0-9]+$ && "$SIZE" =~ ^[0-9]+$ && "$POSITION" -ge 1 && "$SIZE" -ge 1 ]]; then
            if [[ "$POSITION" -lt "$SIZE" ]]; then
              echo "Stacked PR $POSITION of $SIZE (stack #$STACK); Build + Test runs on the top of the stack"
              echo "deferred=true" >> "$GITHUB_OUTPUT"
              echo "top=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Top of stack #$STACK ($POSITION of $SIZE); paths are compared against the stack's base"
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            echo "top=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deferred=false" >> "$GITHUB_OUTPUT"
          echo "top=false" >> "$GITHUB_OUTPUT"
      # With a token the filter reads the pull request's own files, which for
      # the top of a stack is one layer; with no token it diffs the checkout
      # against `base` with git, and the stack's base gives the whole stack.
      - name: Detect backend paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          token: ${{ steps.stack.outputs.top != 'true' && github.token || '' }}
          base: ${{ steps.stack.outputs.top == 'true' && github.event.pull_request.stack.base.ref || '' }}
          filters: |
            backend:
              - 'src/**'
              - 'pom.xml'
              - 'dataexport/**'
              - 'module-contracts/**'
              - 'module-test/**'
              - 'fhir/**'
              - 'Dockerfile'
              - 'build.docker-compose.yml'
              - 'docker-compose.yml'
              - '.github/ci/ci.analyzer-harness.yml'
              - '.github/ci/backend-test-shards.json'
              - '.github/actions/backend-maven-setup/**'
              - '.github/workflows/backend.yml'
              - '.github/scripts/backend_test_*.py'
              - '.github/scripts/publish-checkpoints*.cjs'
            test_infra:
              - 'pom.xml'
              - 'src/test/java/org/openelisglobal/Base*.java'
              - 'src/test/java/org/openelisglobal/AppTestConfig.java'
              - 'src/test/java/org/openelisglobal/IsolatedDatabase.java'
              - 'src/test/resources/common.properties'
              - 'src/test/resources/persistence/**'
              - 'src/test/resources/postgre-db-init/**'
              - 'src/test/resources/testdata/**'
              - '.github/ci/backend-test-shards.json'
              - '.github/actions/backend-maven-setup/**'
              - '.github/workflows/backend.yml'
              - '.github/scripts/backend_test_*.py'
      - name: Plan the backend tests
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TEST_INFRA: ${{ steps.filter.outputs.test_infra }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-backend') }}
        run: |
          full=true; scope=all; isolated=false; shards=false; required=false; matrix='["none"]'
          if [[ "$EVENT" == "pull_request" ]]; then
            mode=$(python3 .github/scripts/backend_test_shards.py mode)
            if [[ "$mode" != "off" ]]; then
              python3 .github/scripts/backend_test_shards.py check
              matrix=$(python3 .github/scripts/backend_test_shards.py matrix)
              scope=shared; isolated=true; shards=true
            fi
            if [[ "$mode" == "required" ]]; then
              required=true
              if [[ "$TEST_INFRA" != "true" && "$FULL_LABEL" != "true" ]]; then
                full=false
              fi
            fi
            echo "Shard mode $mode: single full run=$full ($scope), isolated job=$isolated, shards=$shards (required=$required)"
          else
            echo "$EVENT: single full run of every test class"
          fi
          {
            echo "full=$full"
            echo "full_scope=$scope"
            echo "isolated=$isolated"
            echo "shards=$shards"
            echo "shards_required=$required"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  backend-verify:
    name: Build + Test
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenELIS-Global2
        uses: actions/checkout@v7
        with:
          repository: ${{github.repository}}
          submodules: recursive

      - name: Set up Maven and build local dependencies
        uses: ./.github/actions/backend-maven-setup

      - name: Leave the isolated-database classes to their own job
        if: needs.changes.outputs.full_scope == 'shared'
        run: python3 .github/scripts/backend_test_shards.py excludes-isolated --output "$RUNNER_TEMP/isolated-excludes.txt"

      - name: Build main project
        env:
          EXCLUDES: ${{ needs.changes.outputs.full_scope == 'shared' && format('{0}/isolated-excludes.txt', runner.temp) || '' }}
        run: mvn clean install -Dspotless.check.skip=true ${EXCLUDES:+-Dsurefire.excludesFile=$EXCLUDES}

      - name: Preserve backend and existing-data upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Generate JaCoCo Badge
        if: github.event_name == 'push'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: target/html/badges

      - name: Fix permissions
        if: github.event_name == 'push'
        run: |
          sudo chown -R "$(whoami)":"$(whoami)" target/html
          sudo chmod -R 755 target/html  # Read-write for owner, read for others

      - name: Check coverage report exists
        if: github.event_name == 'push'
        run: ls -lah target/html || echo "Coverage report not found!"

      - name: Publish coverage report to GitHub Pages
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/html/

  # The @IsolatedDatabase classes each start their own PostgreSQL and share no
  # state, so they run several JVMs at a time, apart from the shared database.
  backend-isolated:
    name: Build + Test (isolated databases)
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.isolated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenELIS-Global2
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Maven and build local dependencies
        uses: ./.github/actions/backend-maven-setup

      - name: Run the isolated-database classes
        run: |
          python3 .github/scripts/backend_test_shards.py includes --shard isolated --output "$RUNNER_TEMP/includes.txt"
          forks=$(python3 .github/scripts/backend_test_shards.py forks)
          mvn -B test -Dspotless.check.skip=true -Dsurefire.includesFile="$RUNNER_TEMP/includes.txt" -DforkCount="$forks"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports-isolated
          path: target/surefire-reports/
          if-no-files-found: warn

  # Each shard is a contiguous alphabetical range of the shared-database
  # classes, run in today's order on a fresh database. In shadow mode a shard
  # failure is reported but does not fail its job, so contributors read the
  # single full run as the verdict.
  backend-shard:
    name: Backend shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.shards == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ needs.changes.outputs.shards_required != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout OpenELIS-Global2
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Maven and build local dependencies
        uses: ./.github/actions/backend-maven-setup

      - name: Run shard ${{ matrix.shard }}
        run: |
          python3 .github/scripts/backend_test_shards.py includes --shard "${{ matrix.shard }}" --output "$RUNNER_TEMP/includes.txt"
          mvn -B test -Dspotless.check.skip=true -Dsurefire.includesFile="$RUNNER_TEMP/includes.txt"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports-shard-${{ matrix.shard }}
          path: target/surefire-reports/
          if-no-files-found: warn

  # One summary for all shards: totals, failures, skipped tests with reasons,
  # and a check that every planned class ran exactly once. In shadow mode it
  # also lists every test whose outcome differs from the single full run.
  backend-shard-report:
    name: Backend shard report
    needs: [changes, backend-verify, backend-isolated, backend-shard]
    if: always() && needs.changes.outputs.backend == 'true' && needs.changes.outputs.shards == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenELIS-Global2
        uses: actions/checkout@v7

      - name: Download shard reports
        uses: actions/download-artifact@v7
        with:
          pattern: backend-test-reports-*
          path: reports

      - name: Download the single full run's reports
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@v7
        with:
          name: backend-test-reports
          path: reports/baseline

      - name: Summarize
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
          REQUIRED: ${{ needs.changes.outputs.shards_required }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          args=(--summary "$GITHUB_STEP_SUMMARY" --shard "isolated=reports/backend-test-reports-isolated")
          for shard in $(jq -r '.[]' <<< "$MATRIX"); do
            args+=(--shard "$shard=reports/backend-test-reports-shard-$shard")
          done
          if [[ "$FULL" == "true" ]]; then args+=(--baseline reports/baseline); fi
          if [[ "$REQUIRED" == "true" ]]; then args+=(--strict); fi
          python3 .github/scripts/backend_test_report.py "${args[@]}"

  # The WAR, the dependency scan and the SBOM, without waiting for the tests.
  backend-package:
    name: Package + Scan
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenELIS-Global2
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Maven and build local dependencies
        uses: ./.github/actions/backend-maven-setup

      - name: Package the WAR
        run: mvn -B clean package -Dspotless.check.skip=true -DskipTests -Dmaven.test.skip=true

      - name: Scan repository dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-results.txt
          exit-code: 0
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          trivyignores: .trivyignore

      - name: Generate backend SBOM
        if: always()
        uses: anchore/sbom-action@v0
        with:
          file: target/OpenELIS-Global.war
          output-file: sbom.spdx.json
          artifact-name: openelis-backend-sbom.spdx.json
          dependency-snapshot: ${{ github.event_name == 'push' }}

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-security-reports
          path: |
            trivy-results.txt
            sbom.spdx.json

  backend-checkpoint:
    name: 01 Checkpoint - Backend
    if: always()
    needs:
      [
        changes,
        formatting,
        deployment-contract,
        analyzer-components,
        backend-verify,
        backend-isolated,
        backend-shard,
        backend-shard-report,
        backend-package,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check backend result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          CONTRACT_RESULT: ${{ needs.deployment-contract.result }}
          ANALYZER_RESULT: ${{ needs.analyzer-components.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          FULL_REQUIRED: ${{ needs.changes.outputs.full }}
          ISOLATED_REQUIRED: ${{ needs.changes.outputs.isolated }}
          SHARDS_REQUIRED: ${{ needs.changes.outputs.shards_required }}
          BACKEND_RESULT: ${{ needs.backend-verify.result }}
          ISOLATED_RESULT: ${{ needs.backend-isolated.result }}
          SHARD_RESULT: ${{ needs.backend-shard.result }}
          REPORT_RESULT: ${{ needs.backend-shard-report.result }}
          PACKAGE_RESULT: ${{ needs.backend-package.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$FORMATTING_RESULT" != "success" || "$CONTRACT_RESULT" != "success" || "$ANALYZER_RESULT" != "success" ]]; then
            echo "Required validation failed: formatting=$FORMATTING_RESULT, deployment-contract=$CONTRACT_RESULT, analyzer-components=$ANALYZER_RESULT"
            exit 1
          fi
          if [[ "$BACKEND_REQUIRED" != "true" ]]; then
            echo "Backend checkpoint passed without backend tests (no backend changes, or a stacked PR below the top)."
            exit 0
          fi
          failed=()
          [[ "$PACKAGE_RESULT" == "success" ]] || failed+=("package=$PACKAGE_RESULT")
          [[ "$FULL_REQUIRED" != "true" || "$BACKEND_RESULT" == "success" ]] || failed+=("single full run=$BACKEND_RESULT")
          [[ "$ISOLATED_REQUIRED" != "true" || "$ISOLATED_RESULT" == "success" ]] || failed+=("isolated databases=$ISOLATED_RESULT")
          if [[ "$SHARDS_REQUIRED" == "true" ]]; then
            [[ "$SHARD_RESULT" == "success" ]] || failed+=("shards=$SHARD_RESULT")
            [[ "$REPORT_RESULT" == "success" ]] || failed+=("shard report=$REPORT_RESULT")
          fi
          if (( ${#failed[@]} )); then
            echo "Backend verification failed: ${failed[*]}"
            exit 1
          fi
          echo "Backend checkpoint passed (single full run=$BACKEND_RESULT, isolated=$ISOLATED_RESULT, shards=$SHARD_RESULT, required=$SHARDS_REQUIRED, package=$PACKAGE_RESULT)."
