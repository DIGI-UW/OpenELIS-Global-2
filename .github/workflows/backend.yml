name: 01 - Backend

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  # Gate the expensive Maven build behind a path filter. On pull_request,
  # skip backend-verify entirely when no backend-relevant files changed.
  # On push to develop and workflow_dispatch the filter step is skipped
  # and the `|| 'true'` fallback forces a full build so the JaCoCo badge
  # and Pages publish steps always run on merge.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend || 'true' }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
      - name: Detect backend paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'src/**'
              - 'pom.xml'
              - 'dataexport/**'
              - 'plugins/**'
              - 'fhir/**'
              - 'Dockerfile'
              - 'build.docker-compose.yml'
              - 'docker-compose.yml'
              - 'dev.docker-compose.yml'
              - 'docker-compose.letsencrypt.yml'
              - '.github/ci/ci.analyzer-harness.yml'
              - '.github/workflows/backend.yml'

  backend-verify:
    name: Build + Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Checkout OpenELIS-Global2
        uses: actions/checkout@v6
        with:
          repository: ${{github.repository}}
          submodules: recursive

      - name: check formatting
        run: mvn spotless:check

      - name: Enforce no @PreAuthorize on controllers (S011c)
        run: |
          # Authorization must live on service interfaces, not controllers.
          # Exceptions:
          #  - LoggingController: mutates runtime log config directly, no service.
          #  - SampleTypeManagementRestController: admin management surface.
          #  - /api-mapped controllers (labelpreset): the ModuleAuthenticationInterceptor
          #    auto-allows the /api prefix for any authenticated user, so a controller-level
          #    @PreAuthorize is their only authorization (enforced by
          #    AutoAllowedPathAuthorizationTest) and cannot move to the service layer.
          #  - UnifiedSystemUserRestController: same auto-allow rationale as the /api
          #    controllers above, for /rest. isRestFullPath() also auto-allows /rest, so
          #    the user-administration GET/POST (which read and write ANY user's identity,
          #    account state and role assignments by caller-supplied id) have no module
          #    check standing behind them. Their service calls are gated, but the read
          #    path aggregates several services whose individual privileges are weaker
          #    than "administer users", so the boundary belongs at the controller.
          #  - ImportController: /import has no system_module_url row, so the interceptor
          #    denies it for non-admins; the class-level guard is defence-in-depth over
          #    the already-gated OrganizationImportService/ProviderImportService calls.
          # NOTE: the entries below this line are pre-existing debt inherited from
          # develop (vector, compliance, referral, dictionary, sampleacceptance,
          # requester, notification, testconfiguration, labunit modules). They predate
          # this check being added and are excluded so the gate reflects NEW violations
          # only. Removing them is tracked separately, not in the RBAC migration.
          violations=$(grep -rn "^\s*@PreAuthorize" src/main/java \
            --include="*Controller.java" \
            -l | grep -v "LoggingController.java" \
               | grep -v "SampleTypeManagementRestController.java" \
               | grep -v "LabelPresetRestController.java" \
               | grep -v "OrderEntryLabelRequestController.java" \
               | grep -v "OrderLabelReprintController.java" \
               | grep -v "SiteWideBarcodeSettingsRestController.java" \
               | grep -v "UnifiedSystemUserRestController.java" \
               | grep -v "ImportController.java" \
               | grep -v "SampleAcceptanceRestController.java" \
               | grep -v "VectorIdentificationRestController.java" \
               | grep -v "VectorDeconvolutionRestController.java" \
               | grep -v "VectorSpeciesRestController.java" \
               | grep -v "VectorSamplingSiteRestController.java" \
               | grep -v "VectorTrapTypeRestController.java" \
               | grep -v "VectorSurveillanceRestController.java" \
               | grep -v "ManualEntryFieldMapRestController.java" \
               | grep -v "LabUnitManagementRestController.java" \
               | grep -v "RequestorRestController.java" \
               | grep -v "ComplianceThresholdRestController.java" \
               | grep -v "ComplianceTestCatalogRestController.java" \
               | grep -v "ComplianceDashboardRestController.java" \
               | grep -v "ComplianceStandardRestController.java" \
               | grep -v "ComplianceReportRestController.java" \
               | grep -v "TestComplianceThresholdRestController.java" \
               | grep -v "ReferenceLabResultsRestController.java" \
               | grep -v "ReferralSubcontractDispatchRestController.java" \
               | grep -v "DictionaryRestController.java" \
               | grep -v "TestSectionEditRestController.java" \
               | grep -v "NotificationTriggerConfigRestController.java" || true)
          if [ -n "$violations" ]; then
            echo "ERROR: @PreAuthorize found on controller(s) — move authorization to the service interface:"
            echo "$violations"
            exit 1
          fi
          echo "Controller @PreAuthorize check passed."

      - name: Enforce no hardcoded role-name strings (T045)
        run: |
          # Role names live in Constants.java (and Liquibase seed XML) only.
          # Two patterns: (a) role-lookup APIs called with a string literal,
          # (b) the distinctive multi-word role names anywhere in main Java.
          violations=$(grep -rnE 'getRoleByName\("|getSystemRole\("|addAuthoritiesForRole\("|ROLE_NAMES\.add\("' \
            src/main/java --include="*.java" | grep -v "Constants.java" || true)
          names=$(grep -rnE '"(Global Administrator|User Account Administrator|Analyser Import|EQA Coordinator|Audit Trail)"' \
            src/main/java --include="*.java" | grep -v "Constants.java" || true)
          if [ -n "$violations" ] || [ -n "$names" ]; then
            echo "ERROR: hardcoded role name found — use Constants.ROLE_* instead:"
            echo "$violations"
            echo "$names"
            exit 1
          fi
          echo "Role-name string check passed."

      - name: Initialize and build submodules
        run: |
          cd dataexport
          mvn clean install
          cd ..

      - name: Build main project (produces classes JAR and test-jar for plugins)
        run: mvn clean install -Dspotless.check.skip=true

      - name: Scan repository dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-results.txt
          exit-code: 0
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          trivyignores: .trivyignore

      - name: Generate backend SBOM
        if: always()
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
          artifact-name: openelis-backend-sbom.spdx.json
          dependency-snapshot: ${{ github.event_name == 'push' }}

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-security-reports
          path: |
            trivy-results.txt
            sbom.spdx.json

      # - name: Build plugins (compile-only until analyzer stubs are replaced)
      #   run: cd plugins && mvn clean verify -DskipTests -Dmaven.test.skip=true

      - name: Generate JaCoCo Badge
        if: github.event_name == 'push'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: target/html/badges

      - name: Fix permissions
        if: github.event_name == 'push'
        run: |
              sudo chown -R "$(whoami)":"$(whoami)" target/html
              sudo chmod -R 755 target/html  # Read-write for owner, read for others

      - name: Check coverage report exists
        if: github.event_name == 'push'
        run: ls -lah target/html || echo "Coverage report not found!"     

      - name: Publish coverage report to GitHub Pages
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/html/

  backend-checkpoint:
    name: 01 Checkpoint - Backend
    if: always()
    needs: [changes, backend-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check backend result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-verify.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$BACKEND_RESULT" != "success" && "$BACKEND_RESULT" != "skipped" ]]; then
            echo "Backend verification failed: $BACKEND_RESULT"
            exit 1
          fi
          echo "Backend checkpoint passed (changes=$CHANGES_RESULT, verify=$BACKEND_RESULT)."
