name: Backend / Nightly order check

# Pull requests and develop pushes run the backend tests as shards
# (backend.yml). Every night this runs the whole suite in one JVM on develop,
# twice: in the usual alphabetical order, as the reference, and in reverse
# order. The integration tests share one database per JVM and most fixtures
# commit, so a test that fails only in reverse order depends on another class
# and should seed what it needs itself.
# Neither run gates anything.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-nightly
  cancel-in-progress: false

jobs:
  suite:
    name: Full suite (${{ matrix.order }})
    if: github.event_name == 'workflow_dispatch' || github.repository == 'DIGI-UW/OpenELIS-Global-2'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        order: [alphabetical, reversealphabetical]
    steps:
      - name: Checkout OpenELIS-Global2
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Maven and build local dependencies
        uses: ./.github/actions/backend-maven-setup

      - name: Run every backend test class
        run: mvn -B clean test -Dspotless.check.skip=true -Dsurefire.runOrder=${{ matrix.order }}

      - name: Summarize
        if: always()
        run: python3 .github/scripts/backend_test_report.py --shard "${{ matrix.order }}=target/surefire-reports" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-nightly-reports-${{ matrix.order }}
          path: target/surefire-reports/
          if-no-files-found: warn

