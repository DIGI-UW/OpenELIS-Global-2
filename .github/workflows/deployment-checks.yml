name: Validate publication and deployment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install PyYAML==6.0.2
      - run: node --test .github/scripts/publish-checkpoints.test.cjs
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      # OpenELIS builds and ships the Bridge and mock from their pins, so a pull request into
      # develop, including every pull request of a stack based on develop, must pin commits
      # already merged in those repositories.
      - name: Analyzer submodules are merged upstream
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/submodule_pins.py
