name: Validate publication and deployment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install PyYAML==6.0.2
      - run: node --test .github/scripts/publish-checkpoints.test.cjs
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      # Fails when the Bridge or mock pin is not on its repository's default branch. A stacked
      # pull request reports its parent branch as its base, so the stack's base decides.
      - name: Analyzer submodules are merged upstream
        if: github.event_name == 'pull_request' && (github.event.pull_request.stack.base.ref || github.base_ref) == 'develop'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/submodule_pins.py
