# Multi-arch (amd64 + arm64) dev images for the support containers used by
# docker-compose.yml: database, fhir, proxy. Backend and frontend already get
# arm64 dev images from publish-dev-backend-images.yml / publish-dev-frontend-images.yml;
# without these three, the stack still cannot start on arm64 hosts
# (Apple Silicon, AWS Graviton, Oracle Ampere, Raspberry Pi).
#
# These images only copy config onto multi-arch base images (postgres, tomcat,
# nginx), so building both platforms under QEMU takes a few minutes.
#
# Upstream pushes to Docker Hub (vars.DOCKERHUB_USERNAME); forks push to their
# own GHCR namespace with GITHUB_TOKEN, so the workflow can be tested on a fork
# without any secrets.

name: Publishing / Dev Images / Support (database, fhir, proxy)

on:
  push:
    branches: [develop]
    paths:
      - "db/**"
      - "fhir/**"
      - "tomcat/**"
      - "nginx-proxy/**"
      - ".github/workflows/publish-dev-support-images.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    # Pushes to develop build only upstream; a fork can still test it by dispatching it by hand.
    if: github.repository == 'DIGI-UW/OpenELIS-Global-2' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: database
            context: .
            file: ./db/Dockerfile
          - name: fhir
            context: .
            file: ./fhir/Dockerfile
          - name: proxy
            context: ./nginx-proxy
            file: ./nginx-proxy/Dockerfile
    steps:
      - name: Prepare image name
        id: prep
        run: |
          branch="${{ github.ref_name }}"
          tag="$(echo "$branch" | sed 's/[^a-zA-Z0-9._-]/-/g')"
          if [ "${{ github.repository }}" = "DIGI-UW/OpenELIS-Global-2" ]; then
            echo "registry=docker.io" >> "$GITHUB_OUTPUT"
            image="${{ vars.DOCKERHUB_USERNAME }}/openelis-global-2-${{ matrix.name }}-dev"
          else
            echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
            owner="${{ github.repository_owner }}"
            image="ghcr.io/${owner,,}/openelis-global-2-${{ matrix.name }}-dev"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ steps.prep.outputs.registry == 'docker.io' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: ${{ steps.prep.outputs.registry == 'ghcr.io' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.tag }}

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.tag }}
