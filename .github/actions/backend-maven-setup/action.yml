name: Backend Maven setup
description: >-
  JDK 21, the local Maven repository cache, and the locally built artifacts
  (dataexport, module contracts) that every backend Maven job needs. Run it
  after actions/checkout with submodules.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"
    # Must follow checkout: hashFiles reads the workspace, so a key computed
    # before it hashes nothing and the cache never rotates.
    - name: Cache local Maven repository
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Build dataexport
      shell: bash
      run: mvn -B -f dataexport/pom.xml clean install
    - name: Build the module contracts
      shell: bash
      run: mvn -B -f module-contracts/pom.xml clean install
