services:
  astm-simulator:
    build:
      context: ./tools/analyzer-mock-server
      dockerfile: Dockerfile
    image: openelis-astm-simulator.ci
    container_name: openelis-astm-simulator
    volumes:
      - ./projects/analyzer-harness/volume/analyzer-imports:/data/analyzer-imports
      # Priority simulations resolve exact immutable Bridge profile revisions.
      - ./tools/openelis-analyzer-bridge/src/main/resources/analyzer-profiles:/data/bridge-profiles:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Host port is parameterized so this file can also be run locally, which is
      # what ci-parity-test.sh exists for. On macOS the AirPlay Receiver holds
      # 5000, so a hardcoded mapping fails to bind before anything else runs.
      # Unset (as in CI) keeps the original 5000.
      - "${ASTM_SIMULATOR_PORT:-5000}:9600"
      - "${ASTM_SIMULATOR_HTTP_PORT:-8085}:8080"
      - "5380:5380"
      - "6001:6001"
      - "6002:6002"
    environment:
      - 'ASTM_PORT_TEMPLATES={"9600":"genexpert_astm","5380":"mindray_bc5380","6001":"mindray_bs200","6002":"mindray_bs300"}'
      - RESPONSE_DELAY_MS=0
      - BRIDGE_CONTAINER_NAME=openelis-analyzer-bridge
      - MOCK_CONTAINER_NAME=openelis-astm-simulator
      - ANALYZER_BRIDGE_PROFILES_DIR=/data/bridge-profiles
    command: >
      python -u server.py
      --port 9600
      --simulate-api-port 8080
      --verbose
    networks:
      - analyzer-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',9600)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  openelis-analyzer-bridge:
    build:
      context: ./tools/openelis-analyzer-bridge
      dockerfile: Dockerfile
    image: openelis-analyzer-bridge.ci
    container_name: openelis-analyzer-bridge
    ports:
      - "8442:8443"
      - "12000:12001"
      - "2575:2575"    # MLLP HL7 listener (OGC-325)
    volumes:
      - key_trust-store-volume:/etc/openelis-global
      - ./volume/openelis-analyzer-bridge/configuration.yml:/app/configuration.yml:ro
      - ./projects/analyzer-harness/volume/analyzer-imports:/data/analyzer-imports
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - LOGGING_LEVEL_ORG_ITECH=INFO
      - BRIDGE_FILE_ENABLED=true
      # Fast polling for CI — files are written atomically by Playwright tests.
      # Production keeps FileConfig.java defaults (5000ms poll, 3000ms stability).
      - BRIDGE_FILE_POLL_INTERVAL_MS=1000
      - BRIDGE_FILE_FILE_STABILITY_TIMEOUT_MS=500
      # Bridge connects directly to app (not through proxy), so no /api/ prefix
      # HttpForwardingRouter appends /astm, /hl7, /csv per message protocol
      - ORG_ITECH_AHB_FORWARD_HTTP_SERVER_URI=https://oe.openelis.org:8443/OpenELIS-Global/analyzer
      - ORG_ITECH_AHB_FORWARD_HTTP_SERVER_USERNAME=admin
      - ORG_ITECH_AHB_FORWARD_HTTP_SERVER_PASSWORD=adminADMIN!
      - ORG_ITECH_AHB_FORWARD_HTTP_SERVER_INSECURE_TLS=true
      # TEST-ONLY: disables hostname verification for self-signed harness certs
      - JDK_JAVA_OPTIONS=-Djdk.internal.httpclient.disableHostnameVerification=true
      - ORG_ITECH_AHB_LISTEN_ASTM_SERVER_PORT=12001
      - ORG_ITECH_AHB_FORWARD_ASTM_SERVER_HOST_NAME=astm-simulator
      - ORG_ITECH_AHB_FORWARD_ASTM_SERVER_PORT=9600
      - ORG_ITECH_AHB_MLLP_ENABLED=true
      - ORG_ITECH_AHB_MLLP_PORT=2575
    networks:
      analyzer-net:
        aliases:
          - bridge.openelis.org
    restart: unless-stopped

  oe.openelis.org:
    environment:
      - ANALYZER_BRIDGE_URL=https://bridge.openelis.org:8443
      # Full CATALINA_OPTS required here so compose merge replaces (not drops) base JVM flags.
      # Bridge owns FILE polling (FileAlterationMonitor); OE polling is disabled.
      - CATALINA_OPTS=-Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims -Ddatasource.username=clinlims -Ddatasource.password=${OE_DB_PASSWORD:-clinlims} -Doe.ssl.truststorepath=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore} -Doe.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD:-tspass} -Doe.ssl.keystorepath=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore} -Doe.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD:-kspass}
    volumes:
      - ./projects/analyzer-harness/config-templates:/var/lib/openelis-global/configuration/backend:ro
    networks:
      - default
      - analyzer-net

  proxy:
    networks:
      - default
      - analyzer-net

networks:
  analyzer-net:
    driver: bridge
