# ArchUnit configuration for CoreBoundariesArchitectureTest.
#
# The frozen violation store is committed; CI refuses to create it (a missing store would hide every
# violation). Create or extend it locally with
#   mvn test -Dtest=CoreBoundariesArchitectureTest -Darchunit.freeze.store.default.allowStoreCreation=true
# A run that finds fewer violations than the store may shrink it (allowStoreUpdate); a run that finds a new
# violation fails.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=true
freeze.refreeze=false
# Keep the stored cycle descriptions small: one representative dependency per edge.
cycles.maxNumberOfDependenciesPerEdge=1
