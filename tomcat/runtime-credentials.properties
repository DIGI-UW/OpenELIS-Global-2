# Standard Tomcat substitution keeps runtime credentials out of JVM arguments.
org.apache.tomcat.util.digester.PROPERTY_SOURCE=org.apache.tomcat.util.digester.EnvironmentPropertySource
org.apache.tomcat.util.digester.REPLACE_SYSTEM_PROPERTIES=true
oe.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}
oe.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD}
hapi.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}
hapi.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD}
javax.net.ssl.keyStorePassword=${SSL_KEYSTORE_PASSWORD}
javax.net.ssl.trustStorePassword=${SSL_TRUSTSTORE_PASSWORD}
