server {
    listen 80;
    server_name _;

    # Deployment-supplied translation overrides, mounted over this directory.
    # Kept out of the SPA fallback below: that rewrites anything missing to
    # index.html, so a locale the deployment does not override would answer 200
    # with a page of HTML instead of 404, and the UI would be left inferring
    # "no override" from a JSON parse error. A deployment mounts only the
    # locales it customizes, so missing files are the normal case, not a fault.
    #
    # no-store because the whole point is that an operator can edit these
    # between restarts; a cached 200 would hide the edit they just made.
    location /translation/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        types { application/json json; }
        default_type application/json;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }
}
