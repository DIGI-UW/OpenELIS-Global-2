# Gitpod uses the same source-development launcher as a local checkout.
tasks:
  - name: OpenELIS source development
    before: |
      export SDKMAN_AUTO_ACCEPT=true
      OE_GITPOD_JAVA=$(sed -n 's/^java=//p' .sdkmanrc)
      sdk install java "$OE_GITPOD_JAVA"
      sdk use java "$OE_GITPOD_JAVA"
    init: |
      bash scripts/setup-workspace.sh
    command: |
      scripts/dev-stack doctor
      scripts/dev-stack up
